<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Yuyos & Bonlesito | Menú & Reseñas</title>

    <!-- ⚡ REDIRECCIÓN INTELIGENTE PARA EL QR FÍSICO VIEJO ⚡ -->
    <script>
        if (window.location.hostname.includes("github.io")) {
            window.location.replace("https://vr-tap.pages.dev/Tacos-Yuyos/");
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-primary: #D32F2F;
            --red-dark: #B71C1C;
            --red-light: #FFEBEE;
            --yellow-accent: #FFC107;
            --orange-menu: #FF6F00;
            --green-order: #2E7D32;
            --blue-maps: #1976D2;
            --bg-base: #FFF9E6;
            --text-main: #212121;
            --text-muted: #666666;
            --card-bg: rgba(255, 255, 255, 0.94);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, #FFE082 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(255, 193, 7, 0.25) 0%, transparent 40%),
                radial-gradient(#F5D47A 10%, transparent 11%);
            background-size: 100% 100%, 100% 100%, 28px 28px;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.92) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes starGlint {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(12deg) scale(1.15); }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 410px;
            border-radius: 36px;
            padding: 34px 22px 26px;
            box-shadow: 
                0 20px 40px -15px rgba(211, 47, 47, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.8) inset,
                0 0 0 3px var(--red-primary);
            text-align: center;
            position: relative;
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .nfc-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--red-light);
            color: var(--red-primary);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 16px;
            border: 1px solid rgba(211, 47, 47, 0.15);
        }

        .logo-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .logo {
            width: 210px;
            max-width: 80%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.12));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.03);
        }

        h1 {
            font-family: 'Lilita One', cursive;
            color: var(--red-primary);
            font-size: 2.2rem;
            line-height: 1.1;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 0px var(--yellow-accent);
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .actions-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .action-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            padding: 16px 18px;
            border-radius: 22px;
            color: #ffffff;
            font-weight: 800;
            position: relative;
            overflow: hidden;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.18), 0 10px 18px rgba(0, 0, 0, 0.08);
        }

        .action-card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.18), 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .btn-texts {
            display: flex;
            flex-direction: column;
        }

        .btn-title {
            font-family: 'Lilita One', cursive;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .btn-desc {
            font-size: 0.78rem;
            font-weight: 700;
            opacity: 0.92;
            margin-top: 2px;
        }

        .btn-arrow {
            font-size: 1.2rem;
            opacity: 0.8;
            font-weight: 900;
            padding-right: 4px;
            transition: transform 0.2s ease;
        }

        .action-card:hover .btn-arrow {
            transform: translateX(4px);
        }

        .btn-menu {
            background: linear-gradient(135deg, #FF6F00 0%, #FF8F00 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-reviews {
            background: linear-gradient(135deg, #1E88E5 0%, #1565C0 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-reviews .icon-box {
            animation: starGlint 2.5s infinite ease-in-out;
        }

        .rating-stars {
            color: #FFD54F;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .footer {
            margin-top: 26px;
            padding-top: 16px;
            border-top: 1px dashed rgba(0, 0, 0, 0.08);
            font-size: 0.75rem;
            font-weight: 700;
            color: #888888;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .powered {
            color: #BDBDBD;
            font-size: 0.68rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <div class="nfc-badge">
            <span>✨</span> Menú & Calificación
        </div>

        <div class="logo-wrap">
            <img src="Gemini_Generated_Image_1uuek51uuek51uue.jpeg (2).png" alt="Logo Los Yuyos & Bonlesito" class="logo">
        </div>
        
        <h1>Los Yuyos</h1>
        <div class="subtitle">
            <span>🌮 Tacos</span> • <span>🍗 Boneless</span> • <span>🌽 Antojos</span>
        </div>

        <div class="actions-list">
            
            <!-- 1. Menú Digital -->
            <a href="https://canva.link/menu-yuyos" class="action-card btn-menu" target="_blank" rel="noopener noreferrer">
                <div class="btn-left">
                    <div class="icon-box">📖</div>
                    <div class="btn-texts">
                        <span class="btn-title">Ver Menú Digital</span>
                        <span class="btn-desc">Precios, especialidades y bebidas</span>
                    </div>
                </div>
                <span class="btn-arrow">➔</span>
            </a>

            <!-- 2. Reseña en Google (5 Estrellas) -->
            <a href="https://www.google.com/maps/place/Taquer%C3%ADa+%22Los+Yuyos%22/@19.2979176,-99.0664758,20.35z/data=!4m8!3m7!1s0x85ce038380470487:0xef264bef8d57546b!8m2!3d19.2978155!4d-99.0662889!9m1!1b1!16s%2Fg%2F11g0hvts_d?entry=ttu" class="action-card btn-reviews" target="_blank" rel="noopener noreferrer">
                <div class="btn-left">
                    <div class="icon-box">⭐</div>
                    <div class="btn-texts">
                        <span class="btn-title">Déjanos tu Reseña</span>
                        <span class="rating-stars">★★★★★ <span style="font-size:0.75rem; color:#fff; font-weight:700;">Google Maps</span></span>
                    </div>
                </div>
                <span class="btn-arrow">➔</span>
            </a>

        </div>

        <div class="footer">
            <span>© 2026 Los Yuyos & Bonlesito</span>
            <span class="powered">Marketing Digital Físico • VR+Colab</span>
        </div>

    </div>

</body>
</html>
