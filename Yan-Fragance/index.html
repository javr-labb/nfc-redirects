<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAN Fragance - Enlaces Exclusivos</title>
    <!-- Importar una fuente elegante estilo revista de lujo -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505; /* Fondo negro profundo */
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            margin-top: 8vh;
        }
        /* Estilo para el logo */
        .logo-img {
            width: 160px;
            height: 160px;
            border-radius: 50%; /* Lo hace un círculo perfecto */
            margin: 0 auto 20px auto;
            object-fit: cover;
            border: 1px solid #D4AF37; /* Borde dorado sutil */
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15); /* Resplandor dorado */
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #D4AF37; /* Texto dorado */
            font-weight: 700;
            letter-spacing: 2px;
        }
        p {
            color: #a0a0a0;
            margin-bottom: 40px;
            font-size: 1rem;
            font-style: italic;
        }
        /* Diseño base de los botones */
        .link-btn {
            display: block;
            width: 100%;
            text-decoration: none;
            padding: 16px 0;
            border-radius: 4px; /* Bordes menos redondos se ven más elegantes */
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 18px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .link-btn:active {
            transform: scale(0.97);
        }
        /* Botón Principal (Catálogo) - Gradiente dorado estilo metal */
        .btn-primary {
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            color: #000000;
            border: none;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        /* Botones Secundarios - Negros con borde dorado */
        .btn-secondary {
            background-color: transparent;
            color: #D4AF37;
            border: 1px solid #D4AF37;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo cargado directamente desde tu repositorio -->
        <img src="image_190221.png" alt="YAN Fragance Logo" class="logo-img">
        
        <h1>YAN FRAGANCE</h1>
        <p>Descubre tu esencia ideal</p>

        <!-- BOTÓN 1: EL CATÁLOGO (Acción Principal) -->
        <a href="Catalogo.html" class="link-btn btn-primary">
            Ver Catálogo de Perfumes
        </a>

        <!-- BOTÓN 2: WHATSAPP / COMPRAS -->
        <a href="https://wa.me/5215622190752?text=Hola,+vengo+del+catálogo+VIP+✨+y+me+gustaría+asesoría+para+elegir+una+fragancia+😎" class="link-btn btn-secondary">
            Atención Personalizada
        </a>

        <!-- BOTÓN 3: RESEÑAS -->
        <!-- href="URL_DE_RESEÑAS_AQUI" class="link-btn btn-secondary">
            ⭐ Déjanos una reseña
        !-->
    </div>

</body>
</html>
