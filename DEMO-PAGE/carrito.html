<link rel="stylesheet" href="css/styles.css">

<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">YAN Fragance</a>
    <button class="nav-toggle" data-nav-toggle aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>

    <nav class="nav-menu" data-nav-menu>

  <div class="container page-head">
    <h1>Tu carrito</h1>

          <p id="cart-empty" hidden>Tu carrito está vacío. <a href="catalogo.html">Ver catálogo →</a></p>

          <div class="summary-line"><span>Envío</span><span id="cart-shipping">$0</span></div>
          <div class="summary-line summary-total"><span>Total</span><span id="cart-total">$0</span></div>
          <a href="checkout.html" class="btn btn-primary btn-full" style="margin-top:18px">Ir a pagar</a>
        </div>
      </div>
    </div>
  </section>
