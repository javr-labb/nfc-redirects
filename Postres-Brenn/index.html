<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postres Brenn - Un Dulce Comienzo</title>

    <!-- ⚡ REDIRECCIÓN INTELIGENTE PARA EL QR FÍSICO VIEJO ⚡ -->
    <script>
        if (window.location.hostname.includes("github.io")) {
            window.location.replace("https://vr-tap.pages.dev/Postres-Brenn/");
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f5;
            background-image:
                radial-gradient(#ffc2d1 15%, transparent 16%),
                radial-gradient(#ffc2d1 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            color: #4a4a4a;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 35px 20px;
            box-sizing: border-box;
            border-radius: 30px;
            box-shadow: 0 12px 24px rgba(216, 27, 96, 0.15);
            text-align: center;
            border: 3px dashed #ff99bb;
        }

        .logo {
            width: 190px;
            max-width: 80%;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #e91e63;
            font-size: 38px;
            margin: 0 0 5px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            font-size: 18px;
            color: #f06292;
            margin: 0 0 25px 0;
            font-weight: 700;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-menu {
            background-color: #e91e63;
            color: white;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
        }

        .btn-whatsapp {
            background-color: white;
            color: #e91e63;
            border: 2px solid #e91e63;
        }

        .btn-review {
            background-color: #fce4ec;
            color: #d81b60;
            border: 2px solid transparent;
        }

        .icon {
            font-size: 22px;
            margin-right: 10px;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #aaa;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 30px 18px;
            }

            .logo {
                width: 170px;
            }

            h1 {
                font-size: 34px;
            }

            h2 {
                font-size: 16px;
                margin-bottom: 22px;
            }

            .btn {
                font-size: 15px;
                padding: 14px 15px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="image_9558b8.jpg"
             alt="Logo Postres Brenn"
             class="logo">

        <h1>Postres Brenn</h1>

        <h2>Un Dulce Comienzo</h2>

        <div class="links-container">

            <!-- MENÚ -->
            <a href="https://www.canva.com/design/DAHTt58AaTg/w7yIHO7NR96tZ5CyPNqhwQ/view?utm_content=DAHTt58AaTg&utm_campaign=designshare&utm_medium=link2&utm_source=uniquelinks&utlId=he4ab87200b"
               class="btn btn-menu"
               target="_blank"
               rel="noopener noreferrer">

                <span class="icon">🍰</span>
                Ver Menú de Postres

            </a>

            <!-- WHATSAPP -->
            <a href="https://wa.me/525648627149?text=Realiza%20tu%20pedido%20aqui%20%F0%9F%98%8A%20%20Numero%20de%20cuenta%3A"
               class="btn btn-review"
               target="_blank"
               rel="noopener noreferrer">

                <span class="icon">💬</span>
                Pedidos y Cuenta

            </a>

        </div>

        <div class="footer">
            © 2026 Postres Brenn
        </div>

    </div>

</body>
</html>
