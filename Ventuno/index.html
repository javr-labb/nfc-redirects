  <link

  >


  <style>

    /* =====================================================
       VARIABLES
    ====================================================== */

    :root {

      --black: #050505;

      --black-soft: #090909;

      --white: #f5f3ee;

      --white-soft: #d8d5cd;

      --gray: #96938b;

      --green: #123c32;

      --green-light: #4f8879;

      --burgundy: #5a171b;

      --glass: rgba(255,255,255,0.045);

      --glass-hover: rgba(255,255,255,0.075);

      --border: rgba(255,255,255,0.13);

      --radius: 26px;

    }


    /* =====================================================
       RESET
    ====================================================== */

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

      -webkit-tap-highlight-color: transparent;

    }


    html {

      scroll-behavior: smooth;

    }


    body {

      min-height: 100vh;

      background:

        radial-gradient(
          circle at 50% -10%,
          rgba(18,60,50,0.28),
          transparent 38%
        ),

        radial-gradient(
          circle at 100% 80%,
          rgba(90,23,27,0.20),
          transparent 35%
        ),

        #050505;

      color: var(--white);

      font-family:
        'Plus Jakarta Sans',
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      display: flex;

      justify-content: center;

      padding:
        24px
        16px
        50px;

      overflow-x: hidden;

      position: relative;

    }


    /* =====================================================
       FONDO
    ====================================================== */

    .background {

      position: fixed;

      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 0;

    }


    .glow {

      position: absolute;

      border-radius: 50%;

      filter: blur(70px);

      opacity: .55;

    }


    .glow-1 {

      width: 320px;

      height: 320px;

      top: -160px;

      left: 50%;

      transform: translateX(-50%);

      background:
        rgba(18,60,50,.55);

    }


    .glow-2 {

      width: 260px;

      height: 260px;

      right: -120px;

      bottom: 10%;

      background:
        rgba(90,23,27,.40);

    }


    .glow-3 {

      width: 220px;

      height: 220px;

      left: -130px;

      top: 45%;

      background:
        rgba(255,255,255,.06);

    }


    /* =====================================================
       LOGO GIGANTE DE FONDO
    ====================================================== */

    .background-logo {

      position: absolute;

      width: 650px;

      max-width: 150vw;

      left: 50%;

      top: 47%;

      transform:
        translate(-50%, -50%)
        rotate(-8deg);

      opacity: .018;

      filter: blur(1px);

      user-select: none;

    }


    /* =====================================================
       CONTENEDOR
    ====================================================== */

    .card-container {

      width: 100%;

      max-width: 450px;

      position: relative;

      z-index: 2;

      display: flex;

      flex-direction: column;

      gap: 18px;

    }


    /* =====================================================
       HEADER
    ====================================================== */

    .header-card {

      position: relative;

      overflow: hidden;

      padding:
        42px
        24px
        30px;

      border-radius: 32px;

      border:
        1px solid var(--border);

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.018)
        );

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);

      box-shadow:
        0 25px 70px rgba(0,0,0,.65);

      text-align: center;

      animation:
        fadeUp .7s ease both;

    }


    .header-card::before {

      content: "";

      position: absolute;

      top: 0;

      left: 12%;

      right: 12%;

      height: 1px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.7),
          transparent
        );

      opacity: .55;

    }


    .header-card::after {

      content: "";

      position: absolute;

      width: 220px;

      height: 220px;

      top: -140px;

      left: 50%;

      transform:
        translateX(-50%);

      background:

        radial-gradient(
          circle,
          rgba(255,255,255,.09),
          transparent 70%
        );

      pointer-events: none;

    }


    /* =====================================================
       LOGO
    ====================================================== */

    .logo-wrapper {

      position: relative;

      width: 125px;

      height: 125px;

      margin:
        0 auto
        25px;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .logo-glow {

      position: absolute;

      width: 120px;

      height: 120px;

      border-radius: 50%;

      background:

        radial-gradient(
          circle,
          rgba(255,255,255,.16),
          rgba(18,60,50,.15),
          transparent 70%
        );

      filter: blur(18px);

      opacity: .75;

    }


    .logo-ring {

      position: absolute;

      inset: 0;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,.18);

      box-shadow:
        0 0 35px rgba(255,255,255,.04);

      animation:
        pulseRing 5s ease-in-out infinite;

    }


    .logo {

      position: relative;

      width: 92px;

      height: 92px;

      object-fit: contain;

      z-index: 2;

      filter:

        drop-shadow(
          0 8px 20px
          rgba(255,255,255,.16)
        );

      animation:
        logoAppear .9s ease both;

    }


    @keyframes pulseRing {

      0%,100% {

        transform: scale(1);

        opacity: .55;

      }

      50% {

        transform: scale(1.06);

        opacity: .9;

      }

    }


    @keyframes logoAppear {

      from {

        opacity: 0;

        transform:
          scale(.8)
          rotate(-8deg);

      }

      to {

        opacity: 1;

        transform:
          scale(1)
          rotate(0);

      }

    }


    @keyframes fadeUp {

      from {

        opacity: 0;

        transform:
          translateY(20px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =====================================================
       MARCA
    ====================================================== */

    .brand-title {

      font-family:
        'Cormorant Garamond',
        serif;

      font-size: 43px;

      font-weight: 600;

      letter-spacing: 7px;

      text-transform: uppercase;

      color: var(--white);

      margin-left: 7px;

      margin-bottom: 7px;

    }


    .brand-tagline {

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 3px;

      text-transform: uppercase;

      color: var(--gray);

      margin-bottom: 30px;

    }


    /* =====================================================
       LINEA DECORATIVA
    ====================================================== */

    .decorative-line {

      width: 60px;

      height: 1px;

      margin:
        0 auto
        26px;

      background:

        linear-gradient(
          90deg,
          transparent,
          var(--white-soft),
          transparent
        );

      opacity: .6;

    }


    /* =====================================================
       CTA
    ====================================================== */

    .cta-actions {

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    .btn-save-contact {

      position: relative;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      width: 100%;

      padding: 16px 20px;

      border: none;

      border-radius: 16px;

      background:
        var(--white);

      color:
        var(--black);

      font-size: 13px;

      font-weight: 700;

      letter-spacing: .4px;

      cursor: pointer;

      box-shadow:
        0 8px 30px
        rgba(255,255,255,.10);

      transition:
        .25s ease;

    }


    .btn-save-contact::before {

      content: "";

      position: absolute;

      width: 70px;

      height: 100%;

      top: 0;

      left: -100px;

      transform:
        skewX(-20deg);

      background:
        rgba(255,255,255,.5);

      transition:
        .5s ease;

    }


    .btn-save-contact:hover::before {

      left: 120%;

    }


    .btn-save-contact:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 12px 35px
        rgba(255,255,255,.16);

    }


    .btn-save-contact:active {

      transform:
        scale(.98);

    }


    /* =====================================================
       CONTACTO RAPIDO
    ====================================================== */

    .quick-contact-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;

    }


    .quick-btn {

      min-height: 70px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 7px;

      border-radius: 15px;

      border:
        1px solid
        rgba(255,255,255,.10);

      background:
        rgba(255,255,255,.035);

      color:
        var(--white);

      text-decoration: none;

      font-size: 10px;

      font-weight: 500;

      transition:
        .25s ease;

    }


    .quick-btn i {

      width: 18px;

      height: 18px;

      stroke-width: 1.5;

      color:
        var(--white-soft);

    }


    .quick-btn:hover {

      background:
        rgba(255,255,255,.08);

      border-color:
        rgba(255,255,255,.25);

      transform:
        translateY(-2px);

    }


    /* =====================================================
       REDES
    ====================================================== */

    .links-section {

      display: flex;

      flex-direction: column;

      gap: 11px;

    }


    .section-header {

      display: flex;

      align-items: center;

      gap: 12px;

      margin:
        8px
        6px
        3px;

    }


    .section-label {

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 2.5px;

      text-transform: uppercase;

      color:
        var(--gray);

      white-space: nowrap;

    }


    .section-line {

      height: 1px;

      flex: 1;

      background:

        linear-gradient(
          90deg,
          rgba(255,255,255,.12),
          transparent
        );

    }


    /* =====================================================
       LINK CARD
    ====================================================== */

    .link-card {

      position: relative;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        14px
        16px;

      border-radius: 19px;

      border:
        1px solid
        rgba(255,255,255,.10);

      background:

        linear-gradient(
          110deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      color:
        var(--white);

      text-decoration: none;

      transition:
        .25s ease;

      animation:
        fadeUp .7s ease both;

    }


    .link-card:nth-child(2) {
      animation-delay: .10s;
    }

    .link-card:nth-child(3) {
      animation-delay: .15s;
    }

    .link-card:nth-child(4) {
      animation-delay: .20s;
    }

    .link-card:nth-child(5) {
      animation-delay: .25s;
    }


    .link-card::before {

      content: "";

      position: absolute;

      top: 0;

      bottom: 0;

      left: -100%;

      width: 70%;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.05),
          transparent
        );

      transform:
        skewX(-20deg);

      transition:
        .5s ease;

    }


    .link-card:hover::before {

      left: 130%;

    }


    .link-card:hover {

      background:
        rgba(255,255,255,.07);

      border-color:
        rgba(255,255,255,.20);

      transform:
        translateY(-2px);

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.25);

    }


    .link-left {

      display: flex;

      align-items: center;

      gap: 14px;

    }


    /* =====================================================
       ICONOS
    ====================================================== */

    .link-icon-box {

      width: 44px;

      height: 44px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 13px;

      border:
        1px solid
        rgba(255,255,255,.10);

      background:
        rgba(255,255,255,.04);

    }


    .link-icon-box i {

      font-size: 19px;

    }


    /* WEB */

    .forest {

      background:
        rgba(18,60,50,.30);

      border-color:
        rgba(79,136,121,.25);

    }


    .forest i {

      color:
        #75ad9f;

    }


    /* INSTAGRAM */

    .instagram {

      background:
        rgba(225,48,108,.09);

      border-color:
        rgba(225,48,108,.18);

    }


    .instagram i {

      color:
        #e7a0b8;

    }


    /* YOUTUBE */

    .youtube {

      background:
        rgba(255,0,0,.08);

      border-color:
        rgba(255,0,0,.17);

    }


    .youtube i {

      color:
        #e58a8a;

    }


    /* FACEBOOK */

    .facebook {

      background:
        rgba(24,119,242,.09);

      border-color:
        rgba(24,119,242,.18);

    }


    .facebook i {

      color:
        #8eafe0;

    }


    /* =====================================================
       TEXTOS
    ====================================================== */

    .link-texts h4 {

      font-size: 13px;

      font-weight: 600;

      color:
        var(--white);

      margin-bottom: 3px;

    }


    .link-texts p {

      font-size: 10px;

      font-weight: 400;

      color:
        var(--gray);

    }


    /* =====================================================
       FLECHA
    ====================================================== */

    .link-arrow {

      display: flex;

      align-items: center;

      color:
        #77746e;

      transition:
        .25s ease;

    }


    .link-arrow i {

      width: 17px;

      height: 17px;

      stroke-width: 1.5;

    }


    .link-card:hover .link-arrow {

      color:
        var(--white);

      transform:
        translate(2px,-2px);

    }


    /* =====================================================
       FOOTER
    ====================================================== */

    footer {

      text-align: center;

      margin-top: 6px;

      padding-top: 22px;

      border-top:
        1px solid
        rgba(255,255,255,.07);

    }


    .footer-mark {

      width: 25px;

      margin:
        0 auto
        12px;

      opacity: .5;

    }


    footer p {

      font-size: 9px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color:
        #66645f;

    }


    /* =====================================================
       TOAST
    ====================================================== */

    .toast {

      position: fixed;

      left: 50%;

      bottom: 24px;

      transform:
        translate(-50%,120px);

      display: flex;

      align-items: center;

      gap: 8px;

      padding:
        12px
        20px;

      border-radius: 30px;

      background:
        rgba(10,10,10,.94);

      border:
        1px solid
        rgba(255,255,255,.16);

      color:
        var(--white);

      font-size: 12px;

      font-weight: 600;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.7);

      z-index: 100;

      opacity: 0;

      pointer-events: none;

      transition:
        .35s
        cubic-bezier(.175,.885,.32,1.275);

    }


    .toast.show {

      opacity: 1;

      transform:
        translate(-50%,0);

    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media(max-width:380px) {

      body {

        padding:
          16px
          12px
          35px;

      }


      .header-card {

        padding:
          34px
          18px
          24px;

      }


      .brand-title {

        font-size: 36px;

        letter-spacing: 5px;

      }


      .logo {

        width: 82px;

        height: 82px;

      }

    }

  </style>

</head>


<body>

  <!-- =====================================================

  <script>


    /* =====================================================
       ACTIVAR LUCIDE
    ====================================================== */

    lucide.createIcons();



    /* =====================================================
       GUARDAR CONTACTO
    ====================================================== */

    document
      .getElementById('saveContactBtn')
      .addEventListener(
        'click',
        function () {


          const vcardData = [

            'BEGIN:VCARD',

            'VERSION:3.0',

            'FN:VENTUNO Studio',

            'ORG:VENTUNO',

            'TITLE:Studio Creativo',

            'TEL;TYPE=CELL,VOICE;VALUE=uri:tel:+525663684234',

            'EMAIL;TYPE=WORK,INTERNET:studio@ventuno.online',

            'URL:https://www.ventuno.online/',

            'NOTE:Contacto guardado desde Tarjeta Digital NFC/QR VENTUNO',

            'END:VCARD'

          ].join('\r\n');



          const blob = new Blob(

            [vcardData],

            {
              type:
                'text/vcard;charset=utf-8;'
            }

          );



          const url =
            URL.createObjectURL(blob);



          const link =
            document.createElement('a');



          link.href =
            url;



          link.setAttribute(
            'download',
            'VENTUNO_Contacto.vcf'
          );



          document
            .body
            .appendChild(link);



          link.click();



          document
            .body
            .removeChild(link);



          URL.revokeObjectURL(url);



          showToast(
            'Descargando contacto...'
          );

        }
      );



    /* =====================================================
       TOAST
    ====================================================== */

    function showToast(message) {


      const toast =
        document.getElementById('toast');


      const toastMsg =
        document.getElementById('toastMsg');


      toastMsg.innerText =
        message;


      toast.classList.add('show');


      setTimeout(

        () => {

          toast.classList.remove('show');

        },

        2500

      );

    }

  </script>
