<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VENTUNO | Tarjeta Digital</title>
  
  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --color-black: #080908;
      --color-ivory: #F1EEE7;
      --color-forest: #123C32;
      --color-burgundy: #5A171B;
      --color-taupe: #B8B0A2;
      --color-olive: #686963;
      --color-card-bg: rgba(241, 238, 231, 0.04);
      --color-card-border: rgba(184, 176, 162, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--color-black);
      color: var(--color-ivory);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 40px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-glow-1 {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(18, 60, 50, 0.35) 0%, rgba(8, 9, 8, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-2 {
      position: fixed;
      bottom: -100px;
      right: -50px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(90, 23, 27, 0.25) 0%, rgba(8, 9, 8, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-card {
      background: linear-gradient(180deg, rgba(241, 238, 231, 0.07) 0%, rgba(241, 238, 231, 0.02) 100%);
      border: 1px solid var(--color-card-border);
      border-radius: 28px;
      padding: 32px 24px 28px;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-taupe), transparent);
    }

    .logo-badge {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-forest) 0%, var(--color-black) 100%);
      border: 1.5px solid var(--color-taupe);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(18, 60, 50, 0.4);
    }

    .logo-badge span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      font-weight: 700;
      color: var(--color-ivory);
      letter-spacing: 1px;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--color-ivory);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .brand-tagline {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 2px;
      color: var(--color-taupe);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .cta-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-save-contact {
      background: var(--color-ivory);
      color: var(--color-black);
      border: none;
      border-radius: 16px;
      padding: 15px 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(241, 238, 231, 0.15);
      text-decoration: none;
    }

    .btn-save-contact:active {
      transform: scale(0.98);
      background: #e2ddd3;
    }

    .quick-contact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .quick-btn {
      background: rgba(241, 238, 231, 0.05);
      border: 1px solid var(--color-card-border);
      border-radius: 14px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--color-ivory);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .quick-btn i {
      width: 18px;
      height: 18px;
      stroke-width: 1.75;
      color: var(--color-taupe);
    }

    .quick-btn:active {
      background: rgba(241, 238, 231, 0.12);
      border-color: var(--color-taupe);
      transform: translateY(1px);
    }

    .links-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-olive);
      margin-left: 8px;
      margin-top: 4px;
    }

    .link-card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-border);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--color-ivory);
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .link-card:active {
      background: rgba(241, 238, 231, 0.09);
      border-color: var(--color-taupe);
      transform: scale(0.99);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(241, 238, 231, 0.05);
      border: 1px solid rgba(184, 176, 162, 0.15);
      flex-shrink: 0;
    }

    .link-icon-box.forest {
      background: rgba(18, 60, 50, 0.3);
      border-color: rgba(18, 60, 50, 0.6);
      color: #72B7A8;
    }

    .link-icon-box.burgundy {
      background: rgba(90, 23, 27, 0.3);
      border-color: rgba(90, 23, 27, 0.6);
      color: #E2888D;
    }

    .link-icon-box.taupe {
      background: rgba(184, 176, 162, 0.15);
      border-color: rgba(184, 176, 162, 0.3);
      color: var(--color-taupe);
    }

    .link-texts h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-ivory);
      margin-bottom: 2px;
    }

    .link-texts p {
      font-size: 12px;
      color: var(--color-taupe);
    }

    .link-arrow {
      color: var(--color-olive);
      display: flex;
      align-items: center;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--color-forest);
      color: var(--color-ivory);
      border: 1px solid var(--color-taupe);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      pointer-events: none;
      opacity: 0;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    footer {
      text-align: center;
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px solid rgba(184, 176, 162, 0.1);
    }

    footer p {
      font-size: 11px;
      color: var(--color-olive);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="card-container">
    <header class="header-card">
      <div class="logo-badge">
        <span>V</span>
      </div>
      <h1 class="brand-title">VENTUNO</h1>
      <p class="brand-tagline">Studio • Diseño & Producción</p>

      <div class="cta-actions">
        <button class="btn-save-contact" id="saveContactBtn">
          <i data-lucide="user-plus"></i>
          Guardar en Contactos
        </button>

        <div class="quick-contact-grid">
          <a href="https://wa.me/525663684234?text=Hola%20VENTUNO%2C%20un%20gusto%20saludarte.%20Me%20gustar%C3%ADa%20solicitar%20informaci%C3%B3n." class="quick-btn" target="_blank" rel="noopener">
            <i data-lucide="message-circle"></i>
            <span>WhatsApp</span>
          </a>
          <a href="tel:+525663684234" class="quick-btn">
            <i data-lucide="phone"></i>
            <span>Llamar</span>
          </a>
          <a href="mailto:studio@ventuno.online" class="quick-btn">
            <i data-lucide="mail"></i>
            <span>Correo</span>
          </a>
        </div>
      </div>
    </header>

    <section class="links-section">
      <span class="section-label">Plataformas & Redes</span>

      <a href="https://www.ventuno.online/" target="_blank" rel="noopener" class="link-card">
        <div class="link-left">
          <div class="link-icon-box forest">
            <i data-lucide="globe"></i>
          </div>
          <div class="link-texts">
            <h4>Sitio Web Oficial</h4>
            <p>ventuno.online</p>
          </div>
        </div>
        <div class="link-arrow">
          <i data-lucide="arrow-up-right"></i>
        </div>
      </a>

      <a href="https://www.instagram.com/ventuno_mx/" target="_blank" rel="noopener" class="link-card">
        <div class="link-left">
          <div class="link-icon-box burgundy">
            <i data-lucide="instagram"></i>
          </div>
          <div class="link-texts">
            <h4>Instagram</h4>
            <p>@ventuno_mx</p>
          </div>
        </div>
        <div class="link-arrow">
          <i data-lucide="arrow-up-right"></i>
        </div>
      </a>

      <a href="https://www.youtube.com/@Ventunomx" target="_blank" rel="noopener" class="link-card">
        <div class="link-left">
          <div class="link-icon-box taupe">
            <i data-lucide="youtube"></i>
          </div>
          <div class="link-texts">
            <h4>YouTube</h4>
            <p>@Ventunomx</p>
          </div>
        </div>
        <div class="link-arrow">
          <i data-lucide="arrow-up-right"></i>
        </div>
      </a>

      <a href="https://www.facebook.com/profile.php?id=61571149756521" target="_blank" rel="noopener" class="link-card">
        <div class="link-left">
          <div class="link-icon-box taupe">
            <i data-lucide="facebook"></i>
          </div>
          <div class="link-texts">
            <h4>Facebook</h4>
            <p>Página Oficial</p>
          </div>
        </div>
        <div class="link-arrow">
          <i data-lucide="arrow-up-right"></i>
        </div>
      </a>
    </section>

    <footer>
      <p>© 2026 VENTUNO • Tarjeta Digital</p>
    </footer>
  </div>

  <div class="toast" id="toast">
    <i data-lucide="check-circle-2"></i>
    <span id="toastMsg">Contacto descargado</span>
  </div>

  <script>
    lucide.createIcons();

    document.getElementById('saveContactBtn').addEventListener('click', function () {
      const vcardData = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:VENTUNO Studio',
        'ORG:VENTUNO',
        'TITLE:Studio Creativo',
        'TEL;TYPE=CELL,VOICE;VALUE=uri:tel:+525663684234',
        'EMAIL;TYPE=WORK,INTERNET:studio@ventuno.online',
        'URL:https://www.ventuno.online/',
        'NOTE:Contacto guardado desde Tarjeta Digital NFC/QR VENTUNO',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'VENTUNO_Contacto.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showToast('Descargando contacto...');
    });

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>
</body>
</html>
