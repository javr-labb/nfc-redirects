<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Redirección de respaldo por si el navegador bloquea el JavaScript (actúa a los 4 segundos) -->
    <meta http-equiv="refresh" content="4;url=https://demodtokioramen.vrcolabs.com">
    <title>Redireccionando...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* Fondo oscuro elegante */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        /* Animación del círculo de carga */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #00d2ff; /* Color principal del spinner */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 22px;
            margin: 0;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Estilo para resaltar la marca */
        .brand {
            font-weight: bold;
            color: #00d2ff;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h1>Te estamos redireccionando,<br>al sitio by <span class="brand">VRcolabs</span></h1>

    <script>
        // Redirección principal vía JavaScript después de 3 segundos (3000 milisegundos)
        setTimeout(function() {
            window.location.href = "https://demodtokioramen.vrcolabs.com";
        }, 3000);
    </script>
</body>
</html>
