<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tacos Express | Menú y Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: white;
      font-family: 'Kalam', 'Caveat', cursive;
      overflow-x: hidden;
      position: relative;
    }

    .chalkboard {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(40,40,40,0.8) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(30,30,30,0.9) 0%, transparent 50%),
        linear-gradient(160deg, #111 0%, #1a1a1a 40%, #0d0d0d 100%);
      z-index: 0;
    }

    .splatters {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(255,20,147,0.25) 0%, transparent 8%),
        radial-gradient(circle at 90% 20%, rgba(0,255,255,0.2) 0%, transparent 10%),
        radial-gradient(circle at 15% 80%, rgba(50,205,50,0.22) 0%, transparent 9%),
        radial-gradient(circle at 85% 75%, rgba(255,105,180,0.2) 0%, transparent 7%),
        radial-gradient(circle at 50% 50%, rgba(255,215,0,0.12) 0%, transparent 15%),
        radial-gradient(circle at 70% 10%, rgba(138,43,226,0.18) 0%, transparent 8%),
        radial-gradient(circle at 25% 60%, rgba(0,191,255,0.15) 0%, transparent 6%);
    }

    .content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      text-align: center;
    }

    .phrase {
      position: absolute;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      text-shadow: 
        0 0 8px currentColor,
        0 0 15px currentColor,
        2px 2px 0 rgba(0,0,0,0.5);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0.85;
      line-height: 1.1;
    }

    .p1 {
      top: 5%;
      left: 4%;
      color: #ff69b4;
      font-size: clamp(1.2rem, 3.5vw, 2.1rem);
      transform: rotate(-8deg);
    }

    .p2 {
      top: 7%;
      right: 3%;
      color: #00ffff;
      font-size: clamp(1.15rem, 3.2vw, 1.9rem);
      transform: rotate(6deg);
      text-align: right;
    }

    .p3 {
      top: 26%;
      left: 4%;
      color: #ffd700;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      transform: rotate(-5deg);
    }

    .p4 {
      top: 28%;
      right: 4%;
      color: #da70d6;
      font-size: clamp(1.15rem, 3.2vw, 1.9rem);
      transform: rotate(7deg);
      text-align: right;
    }

    .p5 {
      bottom: 20%;
      left: 3%;
      color: #39ff14;
      font-size: clamp(1.3rem, 3.5vw, 2.2rem);
      transform: rotate(-6deg);
    }

    .p6 {
      bottom: 16%;
      right: 4%;
      color: #ff69b4;
      font-size: clamp(1.1rem, 3vw, 1.7rem);
      transform: rotate(5deg);
      text-align: right;
    }

    .p7 {
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      color: #00bfff;
      font-size: clamp(1rem, 2.8vw, 1.6rem);
    }

    .crown {
      display: inline-block;
      font-size: 1.3em;
      vertical-align: middle;
      filter: drop-shadow(0 0 6px gold);
    }

    .heart {
      color: #ff1493;
      filter: drop-shadow(0 0 6px #ff1493);
    }

    .star {
      display: inline-block;
      color: #ffd700;
      filter: drop-shadow(0 0 4px gold);
    }

    .main {
      max-width: 480px;
      width: 100%;
      padding: 1.6rem 1.3rem;
      background: rgba(0,0,0,0.6);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      backdrop-filter: blur(8px);
      box-shadow: 
        0 0 40px rgba(255,105,180,0.15),
        inset 0 0 30px rgba(0,0,0,0.4);
    }

    .logo {
      font-family: 'Caveat', cursive;
      font-size: clamp(2rem, 6.5vw, 3.1rem);
      font-weight: 700;
      color: #ffd700;
      text-shadow: 
        0 0 12px #ffd700,
        0 0 25px rgba(255,215,0,0.5),
        3px 3px 0 #000;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: clamp(1rem, 2.8vw, 1.3rem);
      color: #ff69b4;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 8px #ff69b4;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.95rem 1.3rem;
      font-family: 'Kalam', cursive;
      font-size: clamp(1.15rem, 3.8vw, 1.45rem);
      font-weight: 700;
      text-decoration: none;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.22s ease;
      box-shadow: 0 5px 18px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
      color: white;
      width: 100%;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    .btn-menu {
      background: linear-gradient(135deg, #ff1493, #ff69b4);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
    }

    .btn-menu:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 24px rgba(255,20,147,0.5);
    }

    .btn-pedido {
      background: linear-gradient(135deg, #00bfff, #1e90ff);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
    }

    .btn-pedido:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 24px rgba(0,191,255,0.5);
    }

    .btn-back {
      background: linear-gradient(135deg, #444, #666);
      font-size: clamp(1rem, 3.2vw, 1.2rem);
    }

    .btn-back:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 24px rgba(100,100,100,0.45);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    .icon {
      font-size: 1.25em;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .menu-title {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.7rem, 5.5vw, 2.4rem);
      color: #ffd700;
      text-shadow: 0 0 12px #ffd700;
      margin-bottom: 1.2rem;
    }

    /* Cart items */
    .cart-items {
      list-style: none;
      margin-bottom: 1.2rem;
      text-align: left;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 0.75rem;
      margin-bottom: 0.5rem;
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
      border-left: 4px solid #ff69b4;
      gap: 0.5rem;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      min-width: 0;
    }

    .item-icon {
      font-size: 1.35em;
      flex-shrink: 0;
    }

    .item-name {
      font-size: clamp(1.05rem, 3.2vw, 1.25rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-price {
      font-size: 0.9rem;
      color: #aaa;
      margin-left: 0.3rem;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      font-family: sans-serif;
    }

    .qty-btn:hover {
      background: rgba(255,255,255,0.28);
    }

    .qty-btn:active {
      transform: scale(0.92);
    }

    .qty-value {
      min-width: 28px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
    }

    /* Total */
    .total-box {
      background: rgba(255,215,0,0.12);
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(1.2rem, 3.8vw, 1.45rem);
    }

    .total-label {
      color: #ffd700;
    }

    .total-amount {
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 8px #ffd700;
    }

    @media (max-width: 600px) {
      .phrase {
        font-size: 1rem !important;
        opacity: 0.7;
      }
      .p1, .p2 { top: 3%; }
      .p3, .p4 { top: 20%; }
      .p5 { bottom: 24%; }
      .p6 { bottom: 18%; }
      .main {
        padding: 1.3rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="chalkboard"></div>
  <div class="splatters"></div>

  <!-- Decorative phrases -->
  <div class="phrase p1">Hoy no se cocina,<br>hoy se taquea <span class="heart">♥️</span></div>
  <div class="phrase p2">El que no come<br>no se divierte <span class="heart">♥️</span></div>
  <div class="phrase p3"><span class="crown">👑</span> Una más y nos vamos<br>(mentira) <span class="star">★</span></div>
  <div class="phrase p4">¡El que no come tacos<br>no se cura!</div>
  <div class="phrase p5"><span class="crown">👑</span> Modo<br>Taco</div>
  <div class="phrase p6">No es vicio<br>es tradición <span class="heart">♥️</span></div>
  <div class="phrase p7">#LosTacosSeComen</div>

  <div class="content">
    <div class="main">

      <!-- HOME -->
      <div id="home" class="view active">
        <div class="logo">🌮 Tacos Express 🌮</div>
        <div class="subtitle">Taquería · Sabor auténtico</div>
        <div class="buttons">
          <button class="btn btn-menu" onclick="showMenu()">
            <span class="icon">📋</span> Menú
          </button>
          <button class="btn btn-pedido" id="homePedidoBtn" onclick="enviarWhatsApp()">
            <span class="icon">🛒</span> Pedido y Cuenta
          </button>
        </div>
      </div>

      <!-- MENU / CART -->
      <div id="menu" class="view">
        <div class="menu-title">🌮 Arma tu pedido</div>

        <ul class="cart-items" id="cartList">
          <!-- filled by JS -->
        </ul>

        <div class="total-box">
          <span class="total-label">Total:</span>
          <span class="total-amount" id="totalAmount">$0</span>
        </div>

        <div class="buttons">
          <button class="btn btn-pedido" id="menuPedidoBtn" onclick="enviarWhatsApp()">
            <span class="icon">📱</span> Enviar pedido por WhatsApp
          </button>
          <button class="btn btn-back" onclick="showHome()">
            ← Regresar al inicio
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const menuItems = [
      { id: 'bistec', name: 'Bistec', price: 25, icon: '🥩' },
      { id: 'longaniza', name: 'Longaniza', price: 20, icon: '🌭' },
      { id: 'asada', name: 'Asada', price: 30, icon: '🔥' },
      { id: 'pechuga', name: 'Pechuga', price: 25, icon: '🍗' },
      { id: 'campechanos', name: 'Campechanos', price: 30, icon: '🌮' },
      { id: 'refresco', name: 'Refresco', price: 25, icon: '🥤' }
    ];

    // Quantities state
    const qty = {};
    menuItems.forEach(item => qty[item.id] = 0);

    function renderCart() {
      const list = document.getElementById('cartList');
      list.innerHTML = '';

      menuItems.forEach(item => {
        const li = document.createElement('li');
        li.className = 'cart-item';
        li.innerHTML = `
          <div class="item-info">
            <span class="item-icon">${item.icon}</span>
            <span class="item-name">${item.name} <span class="item-price">$${item.price}</span></span>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
            <span class="qty-value" id="qty-${item.id}">${qty[item.id]}</span>
            <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        `;
        list.appendChild(li);
      });

      updateTotal();
    }

    function changeQty(id, delta) {
      qty[id] = Math.max(0, qty[id] + delta);
      document.getElementById(`qty-${id}`).textContent = qty[id];
      updateTotal();
    }

    function getTotal() {
      return menuItems.reduce((sum, item) => sum + (qty[item.id] * item.price), 0);
    }

    function updateTotal() {
      const total = getTotal();
      document.getElementById('totalAmount').textContent = `$${total}`;
    }

    function getOrderText() {
      const lines = [];
      let total = 0;

      menuItems.forEach(item => {
        if (qty[item.id] > 0) {
          const subtotal = qty[item.id] * item.price;
          total += subtotal;
          lines.push(`• ${qty[item.id]}x ${item.name} - $${subtotal}`);
        }
      });

      if (lines.length === 0) {
        return null;
      }

      return `*Pedido Tacos Express*\n\n${lines.join('\n')}\n\n*Total: $${total}*\n\nCuenta Clabe: 1234567887654321`;
    }

    function enviarWhatsApp() {
      const orderText = getOrderText();
      let message;

      if (orderText) {
        message = orderText;
      } else {
        // Carrito vacío → mensaje simple con la cuenta clabe
        message = 'Cuenta Clabe: 1234567887654321';
      }

      const url = `https://wa.me/525549297882?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    function showMenu() {
      document.getElementById('home').classList.remove('active');
      document.getElementById('menu').classList.add('active');
      renderCart();
    }

    function showHome() {
      document.getElementById('menu').classList.remove('active');
      document.getElementById('home').classList.add('active');
    }

    // Inicializar
    renderCart();
  </script>
</body>
</html>
